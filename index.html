      c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);

      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    });

  var FONT = '<w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Microsoft YaHei" w:cs="Arial"/>';

      '<pic:pic><pic:nvPicPr><pic:cNvPr id="' + idn + '" name="photo' + idn + '.jpeg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +

  }

      else if (b.t === "h1") body += para(run(b.text, { bold: true, size: 26, color: "15191C" }), { before: 280, after: 120, border: "000000", keep: true });
      else if (b.t === "h2") body += para(run(b.text, { bold: true, size: 22, color: "1F5FA8" }), { before: 180, after: 80, keep: true });
      else if (b.t === "p") body += para(run(b.text, { size: b.size || 20, bold: b.bold, color: b.color }), { after: 80, shade: b.shade });

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>[];
let photos=initial(),sel=0,open=0,view='check',filter='all',kind='检查报告',project={name:'',part:'',org:'',by:'',date:new Date().toLocaleDateString('sv-SE')},saved=false,inspectionId=crypto.randomUUID();
try{const d=JSON.parse(localStorage.getItem('zhujian.refined.v1'));if(d?.photos?.length){photos=d.photos.filter(p=>!p.sample);inspectionId=d.inspectionId||inspectionId;if(photos.length){project=d.project;saved=true}}}catch{}
function persist(){try{localStorage.setItem('zhujian.refined.v1',JSON.stringify({photos,project,inspectionId}));saved=true}catch{saved=false;toast('浏览器存储空间不足，请导出备份')}}
function toast(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)}
function counts(){const all=photos.flatMap(p=>p.findings);return {all:all.length,confirmed:all.filter(f=>f.decision==='confirmed').length,pending:all.filter(f=>f.decision==='pending').length}}
function basisHtml(f){return f.basis.map(b=>`<b>${esc(b.code)}${b.clause?' · '+esc(b.clause):''}</b><span>${esc(b.name)}</span>${b.requirement?'<p>'+esc(b.requirement)+'</p>':''}`).join('')}
function included(){return photos.flatMap(p=>p.findings.filter(f=>f.decision==='confirmed').map(f=>({p,f})))}
function reportHtml(){let list=included(),unverified=list.filter(x=>!x.f.verified).length;return `<div class="reportgrid"><aside class="settings"><h2>整理文书</h2><div class="field"><label>文书类型</label><select id="kind">${['检查报告','整改通知单','立行立改单'].map(k=>`<option ${k===kind?'selected':''}>${k}</option>`).join('')}</select></div><p class="sub">${new Set(list.map(x=>x.p.id)).size} 张照片 · ${list.length} 项已确认问题</p>${unverified?`<div class="notice">${unverified} 项规范依据待核验</div>`:''}${kind!=='检查报告'?'<div class="field"><label>接收 / 责任单位</label><input id="recipient" value="'+esc(project.recipient||'')+'" placeholder="填写单位名称"></div><div class="field"><label>整改截止时间</label><input id="due" type="date" value="'+esc(project.due||'')+'"></div>':''}<p class="footer-note"></p></aside><section class="doc"><div class="watermark">${photos.some(p=>p.sample)?'':''}草稿</div><h1>${kind}</h1><div class="meta">工程：${esc(project.name||'待填写')}<br>部位：${esc(project.part||'待填写')}<br>检查日期：${esc(project.date)} · 检查人：${esc(project.by||'待填写')}${kind!=='检查报告'?'<br>接收单位：'+esc(project.recipient||'待填写')+' · 截止：'+esc(project.due||'待填写'):''}</div>${list.length?list.map(({p,f},i)=>`<div class="docitem"><h3>${String(i+1).padStart(2,'0')}　${esc(f.title)}</h3><img src="${p.image}" alt="问题现场照片"><p><b>问题描述：</b>${esc(f.description)}</p><div class="basis">${basisHtml(f)}${!f.verified?'<small>依据待核验</small>':''}</div>${kind!=='检查报告'?'<p><b>整改要求：</b>'+esc(f.rectification||'待填写')+'</p>':''}${kind==='立行立改单'?'<p><b>整改及复核：</b>待填写处理情况、复核结果及签字。</p>':''}</div>`).join(''):'<div class="empty"><h3>还没有已确认记录</h3><p>返回现场检查，逐项确认后自动生成。</p><button data-view="check">返回确认 →</button></div>'}<div class="meta">检查人：${esc(project.by||'____________')}　复核人：____________</div></section></div>`}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}
function formProject(){modal(`<h2>检查信息</h2><form id="projectform">${[['name','工程名称'],['part','检查部位'],['org','检查单位'],['by','检查人'],['date','检查日期']].map(([k,t])=>`<div class="field"><label>${t}</label><input name="${k}" value="${esc(project[k])}" ${k==='date'?'type="date"':''} ${k==='name'?'required':''}></div>`).join('')}<div class="actions"><button type="button" data-action="close">取消</button><button class="primary">保存</button></div></form>`)}
function edit(i){if(!photos[sel]){toast('请先添加现场照片');return}const f=photos[sel].findings[i];modal(`<h2>${f?'编辑检查记录':'新增检查记录'}</h2><form id="editform" data-i="${i}"><div class="field"><label>问题标题</label><input name="title" value="${esc(f?.title||'')}" required></div><div class="field"><label>问题描述 · 写清部位和事实</label><textarea name="description" required>${esc(f?.description||'')}</textarea></div><div class="two"><div class="field"><label>规范编号</label><input name="code" value="${esc(f?.basis[0]?.code||'')}"></div><div class="field"><label>条款号</label><input name="clause" value="${esc(f?.basis[0]?.clause||'')}"></div></div><div class="field"><label>规范名称</label><input name="standard" value="${esc(f?.basis[0]?.name||'')}"></div><div class="field"><label>条文要求</label><textarea name="requirement">${esc(f?.basis[0]?.requirement||'')}</textarea></div><div class="field"><label>整改要求</label><textarea name="rectification">${esc(f?.rectification||'')}</textarea></div><label style="display:flex;gap:8px;align-items:center;font-size:12px"><input type="checkbox" name="verified" style="width:auto" ${f?.verified?'checked':''}>已核对原文、版本及适用条件</label><div class="actions" style="margin-top:20px"><button type="button" data-action="close">取消</button><button class="primary">保存记录</button></div></form>`)}
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function word(){const list=included();if(!list.length)return toast('请先确认至少一项问题');const B=[{t:'title',text:kind+'（草稿）'},{t:'p',text:'工程：'+project.name+'　部位：'+project.part},{t:'p',text:'检查日期：'+project.date+'　检查人：'+(project.by||'待填写')},{t:'note',text:'示例及未核验依据不得直接作为正式结论。'}];if(kind!=='检查报告')B.push({t:'p',text:'接收单位：'+(project.recipient||'待填写')+'　整改截止：'+(project.due||'待填写')});for(const {p,f} of list){B.push({t:'h1',text:f.title});const img=new Image();img.src=p.image;await img.decode();B.push({t:'image',data:new Uint8Array(await(await fetch(p.image)).arrayBuffer()),w:img.naturalWidth,h:img.naturalHeight});B.push({t:'p',text:'问题描述：'+f.description});for(const b of f.basis)B.push({t:'p',text:'技术依据：'+b.code+' 《'+b.name+'》 '+b.clause+' '+b.requirement+(f.verified?'':'（待核验）')});if(kind!=='检查报告')B.push({t:'p',text:'整改要求：'+f.rectification});if(kind==='立行立改单')B.push({t:'p',text:'整改及复核情况：________________'});}B.push({t:'p',text:'检查人：____________　复核人：____________'});try{const result=MiniDocx.build(B);download(result instanceof Blob?result:new Blob([result],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),kind+'_草稿.docx');toast('已导出 Word 草稿')}catch(e){toast('Word 生成失败，请使用打印 / PDF')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();window.scrollTo(0,0)}if(b.dataset.photo!==undefined){sel=+b.dataset.photo;open=0;render()}if(b.dataset.open!==undefined){open=open===+b.dataset.open?-1:+b.dataset.open;render()}if(b.dataset.decision){photos[sel].findings[+b.dataset.i].decision=b.dataset.decision;persist();render()}if(b.dataset.edit!==undefined)edit(+b.dataset.edit);if(b.dataset.supplement!==undefined){const i=+b.dataset.supplement,inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{if(inp.files[0]){let r=new FileReader();r.onload=()=>{photos[sel].findings[i].supplement=r.result;persist();render()};r.readAsDataURL(inp.files[0])}};inp.click()}switch(b.dataset.action){case'project':formProject();break;case'close':$('#modal').close();break;case'upload':$('#upload').click();break;case'manual':edit(-1);break;case'zoom':modal('<img src="'+photos[sel].image+'" alt="现场照片大图"><button data-action="close">关闭</button>');break;case'print':if(!included().length)return toast('请先确认至少一项问题');window.print();break;case'word':word();break;case'backup':download(new Blob([JSON.stringify({photos,project},null,2)],{type:'application/json'}),'筑检_检查备份.json');break}});
document.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(e.target.id==='projectform'){Object.assign(project,d)}if(e.target.id==='editform'){let i=+e.target.dataset.i,f={...(photos[sel].findings[i]||{}),title:d.title,description:d.description,rectification:d.rectification,basis:[{code:d.code,name:d.standard,clause:d.clause,requirement:d.requirement}],verified:d.verified==='on',decision:'pending'};if(i<0){photos[sel].findings.push(f);open=photos[sel].findings.length-1}else photos[sel].findings[i]=f}persist();$('#modal').close();render()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='kind'){kind=t.value;render()}if(t.id==='recipient'||t.id==='due'){project[t.id]=t.value;persist();render()}if(t.dataset.photoField){photos[sel][t.dataset.photoField]=t.value;persist()}if(t.dataset.answer!==undefined){photos[sel].findings[+t.dataset.answer].answer=t.value;persist()}});
$('#upload').onchange=async e=>{for(const file of e.target.files){if(!file.type.startsWith('image/'))continue;const im=new Image();im.src=URL.createObjectURL(file);try{await im.decode();const c=document.createElement('canvas'),r=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);photos.push({id:crypto.randomUUID(),image:c.toDataURL('image/jpeg',.8),title:file.name,note:'',findings:[],questions:[],sample:false});sel=photos.length-1}finally{URL.revokeObjectURL(im.src)}}e.target.value='';open=0;persist();render();toast('照片已添加，可先人工记录问题')};
function render(){let c=counts();$('#app').innerHTML=`<header><div class="brand">筑检</div><nav><button data-view="check" class="${view==='check'?'active':''}">检查</button><button data-view="report" class="${view==='report'?'active':''}">报告</button></nav></header><div class="shell"><div class="headrow"><div><h1>${esc(project.name||'本次检查')}</h1><div class="sub">${esc(project.part)}</div></div><div class="actions"><button data-action="new-inspection">新建检查</button><button data-action="history">历史</button><button data-action="project">项目信息</button><button data-action="backup">备份</button></div></div>${view==='check'?checkHtml():reportHtml()}</div><footer class="bottom"><div><strong>${photos.length} 张照片 · 已确认 ${c.confirmed} 项</strong><small>${batchStatus(photos)}</small></div><div class="actions">${view==='check'?`<button class="quiet" data-view="report">报告</button><button class="primary" data-action="continue">${nextLabel()}</button>`:'<button data-action="print">打印</button><button data-action="word">导出 Word</button><button class="primary" data-action="finish-inspection">完成并归档</button>'}</div></footer>`}
function checkHtml(){let p=photos[sel];if(!p)return `<section class="start-panel"><div class="camera-mark">＋</div><h2>开始现场检查</h2><button class="primary" data-action="upload">添加现场照片</button></section>`;return `<div class="workspace"><aside class="photos">${photos.map((p,i)=>`<button class="thumb ${i===sel?'selected':''}" data-photo="${i}" aria-label="照片 ${i+1}"><img src="${p.image}" alt="现场照片 ${i+1}"><span class="photo-number">${i+1}</span>${p.findings.length&&p.findings.every(f=>f.decision!=='pending')?'<span class="photo-done">✓</span>':''}</button>`).join('')}<button class="add" data-action="upload" aria-label="添加照片">＋</button></aside><section class="viewer"><div class="vtop"><span class="sub">照片 ${sel+1} <span class="status-pill ${p.findings.length?(p.findings.every(f=>f.decision!=='pending')?'done':''):'wait'}">${photoState(p)}</span></span><div class="actions"><button class="quiet" data-action="reanalyze">重新识别</button><button class="quiet" data-action="zoom">放大</button></div></div><div class="photoarea"><div class="picture"><img src="${p.image}" alt="${esc(p.title)}">${p.findings.map((f,i)=>f.bbox&&f.decision!=='rejected'?`<button class="pin ${f.risk==='高'?'high':''}" data-open="${i}" style="left:${(f.bbox[0]+f.bbox[2])/20}%;top:${(f.bbox[1]+f.bbox[3])/20}%" aria-label="查看问题 ${i+1}">${i+1}</button>`:'').join('')}</div></div><div class="vbottom"><input class="title" data-photo-field="title" value="${esc(p.title)}" aria-label="照片部位"><input class="note" data-photo-field="note" value="${esc(p.note)}" placeholder="添加位置说明" aria-label="现场说明"></div></section><section class="results">${riskHero(p)}${p.error?'<div class="analysis-error" role="alert">'+esc(p.error)+'</div>':''}${p.busy?'<div class="analysis-wait" role="status">正在分析照片 · <span id="elapsed">0 秒</span></div>':''}<div class="resulthead"><h2>问题 ${p.findings.length?'<span class="sub">'+p.findings.length+'</span>':''}</h2><button class="quiet" data-action="manual">＋ 添加</button></div>${p.findings.length?p.findings.map((f,i)=>cardHtml(f,i,p)).join(''):`<div class="empty"><p>${p.busy?'正在分析，请稍候':p.error?'本次识别未完成':p.analyzed?'识别完成，未检出明确问题':'尚未识别此照片'}</p>${!p.busy?'<button data-action="reanalyze">'+(p.analyzed?'重新识别':'开始识别')+'</button>':''}<button data-action="manual">添加问题</button></div>`}</section></div>`}
function cardHtml(f,i,p){let q=p.questions.filter(q=>q.affects?.includes(i+1));return `<article class="card ${open===i?'open':''} ${f.decision==='rejected'?'rejected':''}"><button class="ctop" data-open="${i}" aria-expanded="${open===i}"><span class="severity-tile ${f.risk==='高'?'high':''} ${f.decision==='confirmed'?'done':''}">${i+1}</span><span class="ctext"><b>${esc(f.title)}</b><span class="issue-meta">${f.severity?'<span class="severity">'+esc(f.severity)+'</span>':''}${f.risk?'<span>'+esc(f.risk)+'风险</span>':''}${f.deadline?'<span>'+esc(f.deadline)+'</span>':''}${f.decision==='confirmed'?'<span>已确认</span>':''}</span></span><span class="sub">${f.decision==='rejected'?'已排除':open===i?'−':'＋'}</span></button>${open===i?`<div class="content"><p class="description">${esc(f.description)}</p><div class="label">规范依据${f.verified?'':' · 待核验'}</div><div class="basis">${basisHtml(f)||'待补充'}</div>${!f.bbox?'<div class="label">位置待核实</div>':''}${q.length?`<details class="details"><summary>现场核实（${q.length}）</summary>${q.map(x=>`<p>${esc(x.q)}</p>`).join('')}<textarea data-answer="${i}" placeholder="填写核实结果">${esc(f.answer||'')}</textarea><button data-supplement="${i}">补拍</button>${f.supplement?'<p>已关联照片</p>':''}</details>`:''}<div class="decisions"><button class="${f.decision==='confirmed'?'active':'primary'}" data-decision="${f.decision==='confirmed'?'pending':'confirmed'}" data-i="${i}">${f.decision==='confirmed'?'✓ 已确认':'确认问题'}</button><button data-edit="${i}">编辑</button><button class="quiet" data-decision="${f.decision==='rejected'?'pending':'rejected'}" data-i="${i}">${f.decision==='rejected'?'恢复':'排除'}</button></div><details class="details"><summary>整改建议</summary><p>${esc(f.rectification||'待填写')}</p></details></div>`:''}</article>`}

function nextLabel(){const p=photos[sel];if(!p)return '添加照片';if(p.busy)return '识别中…';if(!p.findings.length&&!p.analyzed)return '开始识别';if(p.findings.some(f=>f.decision==='pending'))return open>=0&&p.findings[open]?.decision==='pending'?'确认并继续':'下一项';return sel<photos.length-1?'下一张':'预览报告'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="continue"]');if(!b)return;let p=photos[sel];if(!p){$('#upload').click();return}if(p.busy)return;if(!p.findings.length&&!p.analyzed){analyzePhoto(p);return}if(open<0||p.findings[open]?.decision!=='pending'){const target=p.findings.findIndex(f=>f.decision==='pending');if(target>=0){open=target;render();document.querySelector('.card.open')?.scrollIntoView({behavior:'smooth',block:'center'});return}}let i=open>=0&&p.findings[open]?.decision==='pending'?open:-1;if(i>=0){p.findings[i].decision='confirmed';persist();const next=p.findings.findIndex(f=>f.decision==='pending');if(next>=0){open=next;render();document.querySelector('.card.open')?.scrollIntoView({behavior:'smooth',block:'center'});return}}if(sel<photos.length-1){sel++;open=0;render();document.querySelector('.viewer')?.scrollIntoView({behavior:'smooth',block:'start'})}else{view='report';render();window.scrollTo(0,0)}});

function riskHero(p){const list=p.findings.filter(f=>f.decision!=='rejected'),high=list.filter(f=>f.risk==='高').length,pending=list.filter(f=>f.decision==='pending').length;if(!list.length)return '';return `<div class="risk-hero ${high?'high':''}"><div class="risk-caption">${high?'存在高风险线索':'待检查人复核'}</div><div class="risk-total"><strong>${list.length}</strong><span>个问题</span></div><p>${high?'高风险 '+high+' 项 · ':''}${pending?'待确认 '+pending+' 项':'均已人工确认'}</p></div>`}
async function analyzePhoto(p){const base=(location.hostname==='zhujian-seven.vercel.app'||location.hostname.endsWith('.vercel.app'))?'':'https://zhujian-seven.vercel.app';p.busy=true;p.error='';render();const began=Date.now();const timer=setInterval(()=>{const el=document.getElementById('elapsed');if(el)el.textContent=Math.floor((Date.now()-began)/1000)+' 秒'},1000);try{const res=await fetch(base+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:p.image,part:project.part,note:p.note}),signal:AbortSignal.timeout(125000)});if(res.status===504)throw Error('后台执行超时，本次未取得结果。请稍后重试');if(res.status===413)throw Error('照片过大，请压缩后重试');let result;try{result=await res.json()}catch{throw Error('后台未返回有效数据，请检查后台网址')}if(!res.ok)throw Error((result.error||'识别失败')+(result.upstreamCode?' ['+result.upstreamCode+']':'')+(result.requestId?' · 请求 '+result.requestId:''));p.history=p.history||[];if(p.analyzed)p.history.push({at:new Date().toISOString(),findings:p.findings,questions:p.questions});p.findings=result.findings;p.questions=result.questions;p.analyzed=true;p.usage=result.usage;p.model=result.model;p.requestId=result.requestId;p.busy=false;open=0;persist();render();toast(p.findings.length?'识别完成，请逐项确认':'照片范围内未识别到明确问题');document.querySelector('.results')?.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){p.busy=false;p.error=e.name==='TimeoutError'?'连接超时，未收到结果；请检查网络或稍后重试':e.message;persist();render();toast(p.error)}finally{clearInterval(timer)}}

document.addEventListener('click',e=>{if(e.target.closest('[data-action="reanalyze"]')){const p=photos[sel];if(p&&!p.busy)analyzePhoto(p)}});

function photoState(p){if(p.busy)return '识别中';if(p.error)return p.analyzed?'重试失败，保留上次结果':'识别失败';if(p.findings.some(f=>f.decision==='pending'))return '待确认';if(p.findings.length)return '已处理';return p.analyzed?'已识别，未检出问题':'未识别'}
function batchStatus(ps){const busy=ps.filter(p=>p.busy).length,failed=ps.filter(p=>p.error).length,unread=ps.filter(p=>!p.busy&&!p.error&&!p.analyzed&&!p.findings.length).length,pending=ps.flatMap(p=>p.findings).filter(f=>f.decision==='pending').length;return [busy?busy+' 张识别中':'',failed?failed+' 张识别失败':'',unread?unread+' 张未识别':'',pending?pending+' 项待确认':''].filter(Boolean).join(' · ')|| (ps.length?'本次检查已处理':'')}
photos.forEach(p=>{if(p.busy){p.busy=false;p.error='上次识别已中断，请重新识别'}});

function resetInspection(){photos=[];project={name:'',part:'',org:'',by:'',date:new Date().toLocaleDateString('sv-SE')};inspectionId=crypto.randomUUID();sel=0;open=0;view='check';kind='检查报告';persist();render();window.scrollTo(0,0)}
function inspectionBusy(){if(photos.some(p=>p.busy)){toast('照片仍在识别，请等待本次请求结束');return true}return false}
function startInspection(finish=false){if(inspectionBusy())return;if(!photos.length){resetInspection();return}const c=counts(),unfinished=photos.filter(p=>p.error||(!p.analyzed&&!p.findings.length)).length;modal(`<h2>${finish?'完成本次检查':'新建检查'}</h2><p>${photos.length} 张照片 · ${c.confirmed} 项已确认</p>${c.pending||unfinished?`<p class="sub">${c.pending} 项待确认，${unfinished} 张尚未完成识别，将作为草稿保存。</p>`:''}<div class="actions"><button data-action="close">返回</button><button class="primary" data-archive-confirm="${finish?'finish':'new'}">${finish?'归档并开始下一次':'保存当前并新建'}</button></div>`)}
let historySaving=false;
async function saveCurrentHistory(status){if(photos.length)await InspectionHistory.save(InspectionHistory.snapshot(inspectionId,photos,project,status))}
async function archiveCurrent(finish){if(historySaving||inspectionBusy())return;historySaving=true;try{const incomplete=photos.some(p=>p.error||(!p.analyzed&&!p.findings.length)||(p.findings||[]).some(f=>f.decision==='pending'));await saveCurrentHistory(finish&&!incomplete?'completed':'draft');$('#modal').close();resetInspection();toast('已保存到历史，可以开始新的检查')}catch(e){toast('历史保存失败，当前检查已保留。请先下载备份。')}finally{historySaving=false}}
async function showHistory(){if(inspectionBusy())return;modal('<h2>历史检查</h2><p>正在读取…</p>');try{const rows=await InspectionHistory.list();$('#modal').innerHTML=`<div class="history-head"><h2>历史检查</h2><button data-action="close">关闭</button></div><p class="sub">保存在此浏览器，换设备不会同步。</p>${rows.length?rows.map(r=>`<button class="history-item" data-history-open="${esc(r.id)}"><span><b>${esc(r.project.name||'未命名检查')}</b><span class="sub">${esc(r.project.date||'')} · ${r.photoCount} 张照片 · ${r.confirmedCount} 项已确认</span></span><span>${r.status==='completed'?'已归档':'草稿'} →</span></button>`).join(''):'<div class="empty">暂无历史检查</div>'}`}catch(e){$('#modal').innerHTML='<h2>暂时无法读取历史</h2><p>当前记录仍保留在检查页。</p><button data-action="close">关闭</button>'}}
async function reopenInspection(id){if(historySaving||inspectionBusy())return;historySaving=true;try{const record=await InspectionHistory.get(id);if(!record)throw Error('记录不存在');if(photos.length&&inspectionId!==id)await saveCurrentHistory('draft');photos=record.photos;photos.forEach(p=>{p.busy=false});project=record.project;inspectionId=record.id;sel=0;open=0;view='check';persist();$('#modal').close();render();window.scrollTo(0,0);toast('已打开历史检查')}catch(e){toast('打开失败，当前检查已保留')}finally{historySaving=false}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.archiveConfirm)archiveCurrent(b.dataset.archiveConfirm==='finish');if(b.dataset.historyOpen)reopenInspection(b.dataset.historyOpen);if(b.dataset.action==='new-inspection')startInspection();if(b.dataset.action==='finish-inspection')startInspection(true);if(b.dataset.action==='history')showHistory()});

async function startFreshPage(){
  if(!photos.length){render();return}
  $('#app').innerHTML='<div class="start-panel"><h2>正在保存上次检查…</h2></div>';
  try{await saveCurrentHistory('draft');resetInspection()}
  catch(e){render();toast('上次记录暂时无法归档，已保留原记录，请先下载备份后新建')}
}
startFreshPage();
</script></body></html>

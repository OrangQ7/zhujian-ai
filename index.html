<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>筑检 · 现场检查</title>
<style>
/* 筑检：黄色警示牌、黑色文字、红黄风险层级 */
:root{--numeral:Bahnschrift,"DIN Alternate","Arial Narrow",system-ui,sans-serif;--ink:#171717;--text:#262626;--muted:#777;--line:#e5e5e5;--wash:#f5f5f5;--sign:#ffc400;--danger:#d0021b;--ok:#00843d;--amber:#9a7100}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:3px}
button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:10px 16px;min-height:44px;font-weight:400}
button:hover{background:var(--wash)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.quiet{background:none;border-color:transparent;color:var(--muted)}
textarea,input,select{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:80px}
h1{font-size:24px;font-weight:600;margin:4px 0}
h2{font-size:18px;margin:0}
h3{font-size:15px;margin:0}
p{margin:8px 0}
.sub{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;align-items:center}

/* 顶栏 */
header{height:82px;background:#fff;color:#111;border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:20px}
.brand{display:flex;align-items:center;gap:10px;color:#111;font-size:26px;font-weight:700;letter-spacing:2px;font-family:"ZCOOL QingKe HuangYou","Microsoft YaHei",sans-serif}
.brand:before{content:'检';display:grid;place-items:center;width:48px;height:48px;background:var(--sign);color:#111;font-size:30px;font-weight:500}
nav{display:flex;gap:8px;align-self:stretch}
nav button,nav button.active{border:0;background:none;border-radius:0;color:var(--muted);min-width:76px;padding:0 18px}
nav button.active{color:#111;box-shadow:inset 0 -4px #111}
nav button:hover{background:var(--wash)}

/* 页面与标题行 */
.shell{max-width:1510px;margin:auto;padding:26px 36px 104px}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}
.headrow h1{font-size:25px;font-weight:650;color:#111}
.headrow .sub{margin-top:5px}
.headrow .actions{gap:4px}
.headrow .actions button{border:1px solid #ddd;color:#444;border-radius:0}

/* 检查工作区：缩略图 / 照片 / 问题 */
.workspace{display:grid;grid-template-columns:100px minmax(300px,1fr) 450px;gap:22px;align-items:start}
.photos{display:grid;gap:13px;padding:6px 3px}
.thumb{position:relative;overflow:hidden;display:grid;gap:6px;min-width:0;padding:0;border:3px solid #fff;border-radius:0;background:transparent;text-align:left;transition:transform .18s,outline .18s}
.thumb:hover{transform:translateY(-2px)}
.thumb.selected{background:#fff;border-color:var(--ink);outline:2px solid var(--ink);outline-offset:1px}
.thumb img{width:100%;height:78px;object-fit:cover}
.photo-number{position:absolute;bottom:5px;left:6px;background:#111;color:#fff;padding:0 6px;border-radius:3px;font-size:12px}
.photo-done{position:absolute;top:4px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;text-align:center;font-size:12px}
.add{min-height:54px;border:1px dashed #ccc;border-radius:0;background:#fafafa;color:#111;font-size:23px}

.viewer{position:sticky;top:20px;background:#fff;overflow:hidden}
.vtop{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.vtop .sub{color:#555}
.vtop{flex-wrap:wrap;gap:4px 8px}
.vtop button{padding:4px 8px;min-height:32px;font-size:14px;white-space:nowrap}
.photoarea{position:relative;display:grid;place-items:center;min-height:390px;padding:22px;background:#f3f3f3}
.picture{position:relative;max-width:100%;line-height:0}
.picture img{max-width:100%;max-height:530px;object-fit:contain}
.pin{position:absolute;width:29px;min-height:29px;padding:0;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:0;background:var(--sign);color:#111;box-shadow:0 0 0 1px #111;font-size:12px}
.pin.high{background:var(--danger);color:#fff}
.vbottom{padding:14px 0}
.vbottom input{border:0;background:none;width:100%;padding:4px 0;color:var(--ink)}
.vbottom input.title{font-size:15px;font-weight:550;color:#111}
.vbottom input.note{font-size:14px;color:#999}

.results{display:grid;gap:0;overflow:hidden;background:#fff;border-left:2px solid var(--ink)}
.risk-hero{padding:24px;background:var(--sign);color:#111;border-top:3px solid #111}
.risk-hero.high{background:var(--danger);color:#fff}
.risk-caption{font-size:15px;font-weight:650}
.risk-total{display:flex;align-items:baseline;gap:12px;margin:9px 0;font-size:36px;font-weight:650;line-height:1.25}
.risk-total strong{font-family:var(--numeral);font-size:68px;line-height:1;font-weight:700}
.risk-hero p{font-size:14px;margin:10px 0 0}
.resulthead{display:flex;justify-content:space-between;align-items:center;height:58px;padding:0 22px;border-bottom:1px solid var(--line)}
.resulthead h2{font-size:17px;font-weight:600;color:#111}
.resulthead h2 .sub{margin-left:5px;color:#111;font-size:13px}
.resulthead button{padding:4px 8px;color:#444;font-size:14px}
.analysis-error{padding:15px 20px;background:#fff0ef;color:#a51c20;border-left:4px solid var(--danger);font-size:14px;overflow-wrap:anywhere}
.analysis-wait{padding:15px 20px;background:#fff7d9;color:#665000;font-size:14px}
.support{padding:14px 22px;border-top:1px solid var(--line)}
.runinfo{padding:10px 22px;border-top:1px solid var(--line);color:#999;font-size:12px;overflow-wrap:anywhere}
.suggest{padding:14px 22px;border-top:1px solid var(--line);background:#fffbea}
.suggest p{margin:4px 0;font-size:14px;color:#444}
.suggest button{margin-top:8px;min-height:36px;padding:6px 12px;border-radius:0;font-size:14px}
.basis .verify{display:block;margin:6px 0 4px;min-height:32px;padding:4px 10px;border-radius:0;font-size:13px}
.basis .verify.done{background:#e6f3ec;color:var(--ok);border-color:#bddfd4}
.empty{padding:35px 24px;text-align:center;background:#fff}
.empty p{color:var(--muted);font-size:14px}

/* 问题卡片 */
.card{background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
.card.open{background:#fafafa;border-color:#ddd}
.card.rejected{opacity:.55}
.ctop{display:flex;align-items:center;gap:18px;width:100%;padding:20px 22px;border:0;border-radius:0;background:#fff;text-align:left}
.ctop:hover{background:#fff}
.card.open .ctop{background:transparent}
.ctext{flex:1}
.ctext b{font-size:17px;font-weight:700;color:#111}
.severity-tile{display:grid;place-items:center;flex:none;width:52px;height:56px;background:var(--sign);color:#111;font-family:var(--numeral);font-size:30px;font-weight:700}
.severity-tile.high{background:var(--danger);color:#fff}
.severity-tile.done{box-shadow:inset 0 -4px var(--ok)}
.issue-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:7px;font-size:13px;line-height:1.5;color:var(--muted)}
.issue-meta .level{color:#946800;font-weight:650}
.issue-meta .level.high{color:var(--danger)}
.content{padding:0 22px 22px 92px}
.description{margin:0 0 8px;font-size:15px;line-height:1.85;color:#333}
.label{margin:16px 0 5px;font-size:13px;color:var(--muted)}
.basis{padding:12px 14px;background:#fff;color:#444;border-left:3px solid var(--sign);font-size:14px}
.basis b{display:block;font-size:14px;font-weight:600;color:#111}
.basis p{margin:4px 0;font-size:14px;line-height:1.65}
.basis small{color:var(--amber);font-size:13px}
.decisions{display:flex;gap:7px;margin-top:18px}
.decisions button{flex:none;min-height:40px;padding:8px 12px;border-radius:0;font-size:14px}
.decisions button.active{background:#e6f3ec;color:var(--ok);border-color:#bddfd4}
.details{margin-top:14px;font-size:14px}
.details summary{cursor:pointer;min-height:32px;color:#666;font-size:13px}
.status-pill{display:inline-block;padding:2px 7px;background:#fff4ca;color:#876300;font-size:12px}
.status-pill.done{background:#e6f3ec;color:var(--ok)}
.status-pill.wait{background:#f6efe2;color:#9b7941}

/* 底栏 */
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 36px;background:#fff;border-top:1px solid #ddd}
.bottom strong{font-size:14px;font-weight:400;color:#333}
.bottom small{margin-left:15px;color:var(--muted);font-size:14px}
.bottom button{border-radius:0;padding:10px 20px}

/* 报告 */
.reportgrid{display:grid;grid-template-columns:250px 1fr;gap:40px}
.settings{align-self:start;padding:22px;background:#fff;border:1px solid var(--line)}
.settings h2{font-size:16px}
.field{margin:12px 0}
.field label{display:block;margin-bottom:5px;font-size:14px;color:var(--muted)}
.notice{margin:0 0 16px;padding:10px 14px;background:#fff7e9;border:1px solid #eee0c8;border-radius:8px;color:#86632e;font-size:14px}
.doc{width:100%;max-width:850px;margin:auto;padding:45px;background:#fff;border:1px solid var(--line)}
.doc h1{text-align:center;font-size:24px}
.doc .meta{margin:20px 0;padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.doc .watermark{text-align:center;color:var(--amber);font-size:13px}
.docitem{margin-top:28px;break-inside:avoid}
.docitem img{display:block;max-height:300px;max-width:100%;margin:12px auto}
.docitem p{font-size:13px}
.docitem .basis{background:#fafafa;border-left:2px solid var(--line)}
.docitem .basis p{font-size:14px}
.evidence{width:100%;border-collapse:collapse;font-size:13px}
.evidence th,.evidence td{border:1px solid #ccc;padding:7px 10px;text-align:left;vertical-align:top}
.evidence th{width:88px;background:#f3f3f3;font-weight:600;white-space:nowrap}

/* 开始页、弹窗、历史、提示 */
.start-panel{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#fff;border:1px solid var(--line)}
.start-panel h2{font-size:23px;font-weight:550;color:#111}
.start-panel button{border-radius:0}
.camera-mark{display:grid;place-items:center;width:80px;height:80px;background:var(--sign);color:#111;font-size:42px;font-weight:300}
dialog{width:min(620px,94vw);max-height:85vh;overflow:auto;padding:28px;border:1px solid var(--line);color:var(--ink)}
dialog::backdrop{background:#152a2a66}
dialog img{max-width:100%;max-height:75vh}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.history-head{display:flex;justify-content:space-between;align-items:center;gap:15px}
.history-item{display:flex;justify-content:space-between;gap:18px;width:100%;margin:12px 0;border-radius:0;text-align:left}
.history-item b,.history-item .sub{display:block}
.history-item b{font-size:15px}
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:50;max-width:90vw;padding:12px 20px;border-radius:8px;background:var(--ink);color:#fff}

@media(max-width:1150px){
  .shell{padding:26px 24px 100px}
  .workspace{grid-template-columns:85px minmax(250px,1fr) 390px;gap:16px}
  .thumb img{height:65px}
}
@media(max-width:900px){
  .workspace{grid-template-columns:minmax(250px,1fr) 370px}
  .photos{grid-column:1/-1;display:flex;overflow:auto;padding:5px 4px 8px}
  .thumb{flex:none;width:88px;min-width:88px}
  .thumb img{height:64px}
  .add{flex:none;width:64px;min-width:64px}
  .viewer{top:15px}
  .photoarea{min-height:320px;padding:16px}
  .reportgrid{grid-template-columns:1fr}
  .settings{display:grid;gap:8px;padding:20px}
  .doc{padding:24px}
}
@media(max-width:640px){
  header{height:72px;padding:0 20px}
  .brand{font-size:23px}
  .brand:before{width:38px;height:38px;font-size:26px}
  nav button,nav button.active{min-width:58px;padding:0 9px;font-size:14px}
  .shell{padding:16px 16px 100px}
  .headrow{flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .headrow h1{font-size:22px}
  .headrow .sub{max-width:200px;font-size:13px}
  .headrow .actions{flex-wrap:wrap}
  .headrow .actions button{min-height:36px;padding:6px 9px;font-size:13px}
  .workspace{display:flex;flex-direction:column;gap:16px}
  .photos{width:100%;margin:0 0 2px}
  .thumb{width:78px;min-width:78px}
  .thumb img{height:58px}
  .viewer{position:static;width:100%}
  .vtop{padding:7px 0}
  .photoarea{min-height:180px;padding:10px}
  .vbottom{padding:10px 0}
  .vbottom input.title{font-size:14px}
  .vbottom input.note{display:none}
  .results{width:100%;border-left:0;border-top:2px solid #111}
  /* 手机上汇总压成一行，让第一条问题尽量出现在首屏 */
  .risk-hero{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:0}
  .risk-caption{display:none}
  .risk-total{margin:0;gap:6px;font-size:16px}
  .risk-total strong{font-size:32px}
  .risk-hero p{margin:0;font-size:13px}
  .support,.runinfo{padding:12px 0}
  .suggest{padding:12px}
  .picture img{max-height:220px}
  .resulthead{padding:0}
  .ctop{padding:18px 0;gap:14px}
  .ctext b{font-size:16px}
  .severity-tile{width:48px;height:52px;font-size:28px}
  .issue-meta{gap:8px}
  .content{padding:0 0 20px 62px}
  .basis{padding:10px}
  .bottom{padding:12px 16px}
  .bottom strong{font-size:13px}
  .bottom small{display:none}
  .bottom .actions{gap:6px}
  .bottom .actions button{padding:10px;font-size:13px}
  .reportgrid{gap:18px}
  .doc{padding:20px}
  .doc h1{font-size:20px}
  .two{grid-template-columns:1fr}
  .history-item{font-size:13px}
}
@media print{
  header,.headrow,.settings,.bottom,.notice,.toast{display:none!important}
  body,.shell{background:#fff;padding:0;margin:0}
  .reportgrid{display:block}
  .doc{border:0;padding:0;max-width:none}
  .doc .basis{background:#fff}
}

      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>';
    var drels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      media.map(function (m) { return '<Relationship Id="' + m.rid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="' + m.name + '"/>'; }).join("") + "</Relationships>";

    var files = [

      { name: "_rels/.rels", data: utf8(rels) },
      { name: "docProps/core.xml", data: utf8(core) },
      { name: "word/document.xml", data: utf8(doc) },
      { name: "word/_rels/document.xml.rels", data: utf8(drels) }

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function reportHtml(){let list=included(),unverified=list.filter(x=>!x.f.verified).length,audit=kind==='审计取证记录';return `<div class="reportgrid"><aside class="settings"><h2>整理文书</h2><div class="field"><label>文书类型</label><select id="kind">${KINDS.map(k=>`<option ${k===kind?'selected':''}>${k}</option>`).join('')}</select></div><p class="sub">${new Set(list.map(x=>x.p.id)).size} 张照片 · ${list.length} 项已确认问题</p>${unverified?`<div class="notice">${unverified} 项依据为 AI 引用，尚未核对条号</div>`:''}${needsRecipient()?'<div class="field"><label>接收 / 责任单位</label><input id="recipient" value="'+esc(project.recipient||'')+'" placeholder="填写单位名称"></div><div class="field"><label>整改截止时间</label><input id="due" type="date" value="'+esc(project.due||'')+'"></div>':''}</aside><section class="doc"><div class="watermark">${photos.some(p=>p.sample)?'':''}草稿</div><h1>${kind}</h1><div class="meta">工程：${esc(project.name||'待填写')}<br>部位：${esc(project.part||'待填写')}<br>检查日期：${esc(project.date)} · 检查人：${esc(project.by||'待填写')}${needsRecipient()?'<br>接收单位：'+esc(project.recipient||'待填写')+' · 截止：'+esc(project.due||'待填写'):''}${audit&&project.standards?'<br>适用规范：'+esc(project.standards).replace(/\n/g,'；'):''}</div>${list.length?list.map(({p,f},i)=>audit?`<div class="docitem"><h3>取证 QZ-${String(i+1).padStart(2,'0')}　${esc(f.title)}</h3><img src="${p.image}" alt="取证照片"><table class="evidence">${evidenceRows(p,f).map(([k,v])=>`<tr><th>${k}</th><td>${esc(v).replace(/\n/g,'<br>')}</td></tr>`).join('')}</table></div>`:`<div class="docitem"><h3>${String(i+1).padStart(2,'0')}　${esc(f.title)}</h3><img src="${p.image}" alt="问题现场照片"><p><b>问题描述：</b>${esc(f.description)}</p><div class="basis">${basisHtml(f)}${!f.verified?'<small>AI 引用 · 未核对</small>':''}</div>${needsRecipient()?'<p><b>整改要求：</b>'+esc(f.rectification||'待填写')+'</p>':''}${kind==='立行立改单'?'<p><b>整改及复核：</b>待填写处理情况、复核结果及签字。</p>':''}</div>`).join(''):'<div class="empty"><h3>还没有已确认记录</h3><p>返回现场检查，逐项确认后自动生成。</p><button data-view="check">返回确认 →</button></div>'}<div class="meta">${audit?'取证人：'+esc(project.by||'____________')+'　被检查单位确认人：____________　日期：____________':'检查人：'+esc(project.by||'____________')+'　复核人：____________'}</div></section></div>`}

function edit(i){if(!photos[sel]){toast('请先添加现场照片');return}const f=photos[sel].findings[i];modal(`<h2>${f?'编辑检查记录':'新增检查记录'}</h2><form id="editform" data-i="${i}"><div class="field"><label>问题标题</label><input name="title" value="${esc(f?.title||'')}" required></div><div class="field"><label>问题描述 · 写清部位和事实</label><textarea name="description" required>${esc(f?.description||'')}</textarea></div><div class="two"><div class="field"><label>规范编号</label><input name="code" value="${esc(f?.basis[0]?.code||'')}"></div><div class="field"><label>条款号</label><input name="clause" value="${esc(f?.basis[0]?.clause||'')}"></div></div><div class="field"><label>规范名称</label><input name="standard" value="${esc(f?.basis[0]?.name||'')}"></div><div class="field"><label>条文要求</label><textarea name="requirement">${esc(f?.basis[0]?.requirement||'')}</textarea></div><div class="field"><label>可能后果</label><textarea name="consequence">${esc(f?.consequence||'')}</textarea></div><div class="field"><label>整改要求</label><textarea name="rectification">${esc(f?.rectification||'')}</textarea></div><label style="display:flex;gap:8px;align-items:center;font-size:12px"><input type="checkbox" name="verified" style="width:auto" ${f?.verified?'checked':''}>已核对原文、版本及适用条件</label><div class="actions" style="margin-top:20px"><button type="button" data-action="close">取消</button><button class="primary">保存记录</button></div></form>`)}

async function word(){const list=included();if(!list.length)return toast('请先确认至少一项问题');const B=[{t:'title',text:kind+'（草稿）'},{t:'p',text:'工程：'+project.name+'　部位：'+project.part},{t:'p',text:'检查日期：'+project.date+'　检查人：'+(project.by||'待填写')},{t:'note',text:'标注「AI 引用，未核对」的依据须核对原文后再作为正式结论。'}];const audit=kind==='审计取证记录';if(needsRecipient())B.push({t:'p',text:'接收单位：'+(project.recipient||'待填写')+'　整改截止：'+(project.due||'待填写')});if(audit&&project.standards)B.push({t:'p',text:'适用规范：'+project.standards.replace(/\n/g,'；')});for(const [i,{p,f}] of list.entries()){B.push({t:'h1',text:(audit?'取证 QZ-'+String(i+1).padStart(2,'0')+'　':'')+f.title});const img=new Image();img.src=p.image;await img.decode();B.push({t:'image',data:new Uint8Array(await(await fetch(p.image)).arrayBuffer()),w:img.naturalWidth,h:img.naturalHeight});if(audit){B.push({t:'table',widths:[1700,8050],rows:evidenceRows(p,f).map(([k,v])=>({cells:[{text:k,bold:true,fill:'F3F3F3'},{text:v}]}))});continue}B.push({t:'p',text:'问题描述：'+f.description});for(const b of f.basis)B.push({t:'p',text:'技术依据：'+b.code+' 《'+b.name+'》 '+b.clause+' '+b.requirement+(f.verified?'':'（AI 引用，未核对）')});if(needsRecipient())B.push({t:'p',text:'整改要求：'+f.rectification});if(kind==='立行立改单')B.push({t:'p',text:'整改及复核情况：________________'});}B.push({t:'p',text:audit?'取证人：'+(project.by||'____________')+'　被检查单位确认人：____________　日期：____________':'检查人：____________　复核人：____________'});try{const result=MiniDocx.build(B);download(result instanceof Blob?result:new Blob([result],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),kind+'_草稿.docx');toast('已导出 Word 草稿')}catch(e){toast('Word 生成失败，请使用打印 / PDF')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();window.scrollTo(0,0)}if(b.dataset.photo!==undefined){sel=+b.dataset.photo;open=0;render()}if(b.dataset.open!==undefined){open=open===+b.dataset.open?-1:+b.dataset.open;render()}if(b.dataset.decision){photos[sel].findings[+b.dataset.i].decision=b.dataset.decision;persist();render()}if(b.dataset.edit!==undefined)edit(+b.dataset.edit);if(b.dataset.verify){const [i,j]=b.dataset.verify.split(':').map(Number),x=photos[sel].findings[i].basis[j];syncClause(x,!x.clause_verified);persist();render();if(x.clause_verified)toast('已记住这条条款，以后引用同一条会自动标为已核对')}if(b.dataset.supplement!==undefined){const i=+b.dataset.supplement,inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{if(inp.files[0]){let r=new FileReader();r.onload=()=>{photos[sel].findings[i].supplement=r.result;persist();render()};r.readAsDataURL(inp.files[0])}};inp.click()}switch(b.dataset.action){case'project':formProject();break;case'close':$('#modal').close();break;case'upload':$('#upload').click();break;case'manual':edit(-1);break;case'zoom':modal('<img src="'+photos[sel].image+'" alt="现场照片大图"><button data-action="close">关闭</button>');break;case'print':if(!included().length)return toast('请先确认至少一项问题');window.print();break;case'word':word();break;case'backup':download(new Blob([JSON.stringify({photos,project},null,2)],{type:'application/json'}),'筑检_检查备份.json');break}});

document.addEventListener('change',e=>{const t=e.target;if(t.id==='kind'){kind=t.value;render()}if(t.id==='recipient'||t.id==='due'){project[t.id]=t.value;persist();render()}if(t.dataset.photoField){photos[sel][t.dataset.photoField]=t.value;persist()}if(t.dataset.answer!==undefined){photos[sel].findings[+t.dataset.answer].answer=t.value;persist()}});
$('#upload').onchange=async e=>{for(const file of e.target.files){if(!file.type.startsWith('image/'))continue;const im=new Image();im.src=URL.createObjectURL(file);try{await im.decode();const c=document.createElement('canvas'),r=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);photos.push({id:crypto.randomUUID(),image:c.toDataURL('image/jpeg',.8),title:file.name,note:'',findings:[],questions:[],sample:false});sel=photos.length-1}finally{URL.revokeObjectURL(im.src)}}e.target.value='';open=0;persist();render();toast('照片已添加，可先人工记录问题')};
function render(){let c=counts();$('#app').innerHTML=`<header><div class="brand">筑检</div><nav><button data-view="check" class="${view==='check'?'active':''}">检查</button><button data-view="report" class="${view==='report'?'active':''}">报告</button></nav></header><div class="shell"><div class="headrow"><div><h1>${esc(project.name||'本次检查')}</h1><div class="sub">${esc(project.part)}</div></div><div class="actions"><button data-action="new-inspection">新建检查</button><button data-action="history">历史</button><button data-action="project">项目信息</button><button data-action="backup">备份</button></div></div>${view==='check'?checkHtml():reportHtml()}</div><footer class="bottom"><div><strong>${photos.length} 张照片 · 已确认 ${c.confirmed} 项</strong><small>${batchStatus(photos)}</small></div><div class="actions">${view==='check'?`<button class="quiet" data-view="report">报告</button><button class="primary" data-action="continue">${nextLabel()}</button>`:'<button data-action="print">打印</button><button data-action="word">导出 Word</button><button class="primary" data-action="finish-inspection">完成并归档</button>'}</div></footer>`}
function checkHtml(){let p=photos[sel];if(!p)return `<section class="start-panel"><div class="camera-mark">＋</div><h2>开始现场检查</h2><button class="primary" data-action="upload">添加现场照片</button></section>`;return `<div class="workspace"><aside class="photos">${photos.map((p,i)=>`<button class="thumb ${i===sel?'selected':''}" data-photo="${i}" aria-label="照片 ${i+1}"><img src="${p.image}" alt="现场照片 ${i+1}"><span class="photo-number">${i+1}</span>${p.findings.length&&p.findings.every(f=>f.decision!=='pending')?'<span class="photo-done">✓</span>':''}</button>`).join('')}<button class="add" data-action="upload" aria-label="添加照片">＋</button></aside><section class="viewer"><div class="vtop"><span class="sub">照片 ${sel+1} <span class="status-pill ${p.findings.length?(p.findings.every(f=>f.decision!=='pending')?'done':''):'wait'}">${photoState(p)}</span></span><div class="actions">${p.busy?'':analyzeButtons('quiet')}<button class="quiet" data-action="zoom">放大</button></div></div><div class="photoarea"><div class="picture"><img src="${p.image}" alt="${esc(p.title)}">${p.findings.map((f,i)=>f.bbox&&f.decision!=='rejected'?`<button class="pin ${f.risk==='高'?'high':''}" data-open="${i}" style="left:${(f.bbox[0]+f.bbox[2])/20}%;top:${(f.bbox[1]+f.bbox[3])/20}%" aria-label="查看问题 ${i+1}">${i+1}</button>`:'').join('')}</div></div><div class="vbottom"><input class="title" data-photo-field="title" value="${esc(p.title)}" aria-label="照片部位"><input class="note" data-photo-field="note" value="${esc(p.note)}" placeholder="添加位置说明" aria-label="现场说明"></div></section><section class="results">${riskHero(p)}${p.error?'<div class="analysis-error" role="alert">'+esc(p.error)+'</div>':''}${p.busy?'<div class="analysis-wait" role="status">'+(p.busyMode==='deep'?'正在深度思考，约 1～2 分钟':'正在快速识别')+' · <span id="elapsed">0 秒</span></div>':''}<div class="resulthead"><h2>问题 ${p.findings.length?'<span class="sub">'+p.findings.length+'</span>':''}</h2><button class="quiet" data-action="manual">＋ 添加</button></div>${p.findings.length?p.findings.map((f,i)=>cardHtml(f,i,p)).join(''):`<div class="empty"><p>${p.busy?'正在分析，请稍候':p.error?'本次识别未完成':p.analyzed?'识别完成，未检出明确问题':'尚未识别此照片'}</p>${!p.busy?analyzeButtons(''):''}<button data-action="manual">添加问题</button></div>`}${suggestHtml(p)}${supportHtml(p)}${runInfo(p)}</section></div>`}
// 本次识别用的模式、模型和总耗时（含网络），方便判断慢在哪里
function runInfo(p){if(!p.analyzed||p.busy||!p.model)return '';return `<div class="runinfo">${MODE_NAME[p.mode]||'识别'} · ${esc(p.model)}${p.elapsed?' · '+p.elapsed+' 秒':''}${p.usage?.output_tokens?' · 输出 '+p.usage.output_tokens+' tokens':''}</div>`}
// 模型推荐的工程类型和规范：只列项目信息里还没有的，由检查人一键采用
const stdCode=s=>((s.match(/[A-Z]{1,4}(?:\/T)?\s*\d+(?:\.\d+)?/i)||[s.trim()])[0]).replace(/\s+/g,'').toUpperCase();
const newStandards=p=>(p.suggested_standards||[]).filter(s=>!(project.standards||'').split('\n').some(l=>l.trim()&&stdCode(l)===stdCode(s)));
function suggestHtml(p){const s=newStandards(p),t=!project.type&&p.work_type;if(!s.length&&!t)return '';return `<div class="suggest"><b>建议适用规范</b>${t?'<p>工程类型：'+esc(p.work_type)+'</p>':''}${s.map(x=>'<p>'+esc(x)+'</p>').join('')}<button data-action="adopt">加入项目信息</button></div>`}
document.addEventListener('click',e=>{if(!e.target.closest('[data-action="adopt"]'))return;const p=photos[sel],s=newStandards(p);if(!project.type&&p.work_type)project.type=p.work_type;project.standards=[...(project.standards||'').split('\n').filter(l=>l.trim()),...s].join('\n');persist();render();toast('已加入项目信息，之后识别会优先引用这些规范')});
function cardHtml(f,i,p){let q=p.questions.filter(q=>q.affects?.includes(i+1));return `<article class="card ${open===i?'open':''} ${f.decision==='rejected'?'rejected':''}"><button class="ctop" data-open="${i}" aria-expanded="${open===i}"><span class="severity-tile ${f.risk==='高'?'high':''} ${f.decision==='confirmed'?'done':''}">${i+1}</span><span class="ctext"><b>${esc(f.title)}</b><span class="issue-meta">${f.risk?'<span class="level '+(f.risk==='高'?'high':'')+'">'+esc(f.risk)+'风险</span>':''}${f.severity?'<span>'+esc(f.severity)+'</span>':''}${f.deadline?'<span>'+esc(f.deadline)+'</span>':''}${f.decision==='confirmed'?'<span>已确认</span>':''}</span></span><span class="sub">${f.decision==='rejected'?'已排除':open===i?'−':'＋'}</span></button>${open===i?`<div class="content"><p class="description">${esc(f.description)}</p>${f.evidence?'<div class="label">可见证据：'+esc(f.evidence)+'</div>':''}${f.consequence?'<div class="label">可能后果：'+esc(f.consequence)+'</div>':''}<div class="label">规范依据${f.verified?' · 已核对':' · AI 引用，请核对条号'}</div><div class="basis">${basisHtml(f,i)||'待补充'}</div>${!f.bbox?'<div class="label">位置待核实</div>':''}${q.length?`<details class="details"><summary>现场核实（${q.length}）</summary>${q.map(x=>`<p>${esc(x.q)}</p>`).join('')}<textarea data-answer="${i}" placeholder="填写核实结果">${esc(f.answer||'')}</textarea><button data-supplement="${i}">补拍</button>${f.supplement?'<p>已关联照片</p>':''}</details>`:''}<div class="decisions"><button class="${f.decision==='confirmed'?'active':'primary'}" data-decision="${f.decision==='confirmed'?'pending':'confirmed'}" data-i="${i}">${f.decision==='confirmed'?'✓ 已确认':'确认问题'}</button><button data-edit="${i}">编辑</button><button class="quiet" data-decision="${f.decision==='rejected'?'pending':'rejected'}" data-i="${i}">${f.decision==='rejected'?'恢复':'排除'}</button></div><details class="details"><summary>整改建议</summary><p>${esc(f.rectification||'待填写')}</p></details></div>`:''}</article>`}

// 底栏按钮只确认用户能看到的那一项：标题和至少一部分描述露在底栏上方
function onScreen(card){if(!card)return false;const r=card.getBoundingClientRect(),limit=document.querySelector('.bottom')?.getBoundingClientRect().top??innerHeight;return r.top>=0&&Math.min(r.bottom,limit)-r.top>=Math.min(r.height,140)}
function nextLabel(){const p=photos[sel];if(!p)return '添加照片';if(p.busy)return '识别中…';if(!p.findings.length&&!p.analyzed)return '开始识别';if(p.findings.some(f=>f.decision==='pending'))return open>=0&&p.findings[open]?.decision==='pending'?'确认并继续':'下一项';return sel<photos.length-1?'下一张':'预览报告'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="continue"]');if(!b)return;let p=photos[sel];if(!p){$('#upload').click();return}if(p.busy)return;if(!p.findings.length&&!p.analyzed){analyzePhoto(p);return}if(open<0||p.findings[open]?.decision!=='pending'){const target=p.findings.findIndex(f=>f.decision==='pending');if(target>=0){open=target;render();document.querySelector('.card.open')?.scrollIntoView({behavior:'smooth',block:'center'});return}}let i=open>=0&&p.findings[open]?.decision==='pending'?open:-1;if(i>=0&&!onScreen(document.querySelector('.card.open'))){document.querySelector('.card.open')?.scrollIntoView({behavior:'smooth',block:'center'});toast('请先查看这一项，再点确认');return}if(i>=0){p.findings[i].decision='confirmed';persist();const next=p.findings.findIndex(f=>f.decision==='pending');if(next>=0){open=next;render();document.querySelector('.card.open')?.scrollIntoView({behavior:'smooth',block:'center'});return}}if(sel<photos.length-1){sel++;open=0;render();document.querySelector('.viewer')?.scrollIntoView({behavior:'smooth',block:'start'})}else{view='report';render();window.scrollTo(0,0)}});

function riskHero(p){const list=p.findings.filter(f=>f.decision!=='rejected'),high=list.filter(f=>f.risk==='高').length,pending=list.filter(f=>f.decision==='pending').length;if(!list.length)return '';return `<div class="risk-hero ${high?'high':''}"><div class="risk-caption">${high?'存在高风险线索':'待检查人复核'}</div><div class="risk-total"><strong>${list.length}</strong><span>个问题</span></div><p>${high?'高风险 '+high+' 项 · ':''}${pending?'待确认 '+pending+' 项':'均已人工确认'}</p></div>`}
// 自有域名在大陆网络更容易连上；连不上时退回 vercel.app。页面本身由后台提供时直接同源调用
const API_BASES=/(^|\.)zhujianai\.site$|\.vercel\.app$/.test(location.hostname)?['']:['https://www.zhujianai.site','https://zhujian-seven.vercel.app'];
async function callAnalyze(body,timeout=125000){let last;for(const base of API_BASES){try{return await fetch(base+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body,signal:AbortSignal.timeout(timeout)})}catch(e){last=e;if(e.name!=='TypeError')throw e}}throw last}
// mode：fast 快速识别（轻量模型，不开思考）；deep 深度思考（主模型开启思考，约 1～2 分钟）
const MODE_NAME={fast:'快速识别',deep:'深度思考'};
async function analyzePhoto(p,mode='fast'){p.busy=true;p.busyMode=mode;p.error='';render();const began=Date.now();const timer=setInterval(()=>{const el=document.getElementById('elapsed');if(el)el.textContent=Math.floor((Date.now()-began)/1000)+' 秒'},1000);try{const res=await callAnalyze(JSON.stringify({image:p.image,mode,type:project.type,standards:project.standards,part:project.part,note:p.note}),mode==='deep'?185000:125000);if(res.status===504)throw Error('后台执行超时，本次未取得结果。请稍后重试');if(res.status===413)throw Error('照片过大，请压缩后重试');let result;try{result=await res.json()}catch{throw Error('后台未返回有效数据，请检查后台网址')}if(!res.ok&&result.diagnostic)console.warn('模型原始输出',result.requestId,result.diagnostic);if(!res.ok)throw Error((result.error||'识别失败')+(result.upstreamCode?' ['+result.upstreamCode+']':'')+(result.requestId?' · 请求 '+result.requestId:''));p.history=p.history||[];if(p.analyzed)p.history.push({at:new Date().toISOString(),findings:p.findings,questions:p.questions});result.findings.forEach(applyVerified);p.findings=result.findings;p.questions=result.questions;p.quality_notes=result.quality_notes||[];p.work_type=result.work_type||'';p.suggested_standards=result.suggested_standards||[];p.analyzed=true;p.mode=result.mode||mode;p.elapsed=Math.round((Date.now()-began)/1000);p.usage=result.usage;p.model=result.model;p.requestId=result.requestId;p.busy=false;open=0;persist();render();toast(MODE_NAME[mode]+(p.findings.length?'完成，请逐项确认':'完成，照片范围内未检出明确问题'));document.querySelector('.results')?.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){p.busy=false;p.error=e.name==='TimeoutError'?'连接超时，未收到结果；请检查网络或稍后重试':e.name==='TypeError'?'无法连接识别服务，可能是网络或地区限制。请换个网络稍后重试，或先手动添加问题':e.message;persist();render();toast(p.error)}finally{clearInterval(timer)}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-analyze]');if(!b)return;const p=photos[sel];if(p&&!p.busy)analyzePhoto(p,b.dataset.analyze)});
const analyzeButtons=cls=>`<button class="${cls}" data-analyze="fast">快速识别</button><button class="${cls}" data-analyze="deep">深度思考</button>`;

function photoState(p){if(p.busy)return '识别中';if(p.error)return p.analyzed?'重试失败，保留上次结果':'识别失败';if(p.findings.some(f=>f.decision==='pending'))return '待确认';if(p.findings.length)return '已处理';return p.analyzed?'已识别，未检出问题':'未识别'}
function batchStatus(ps){const busy=ps.filter(p=>p.busy).length,failed=ps.filter(p=>p.error).length,unread=ps.filter(p=>!p.busy&&!p.error&&!p.analyzed&&!p.findings.length).length,pending=ps.flatMap(p=>p.findings).filter(f=>f.decision==='pending').length;return [busy?busy+' 张识别中':'',failed?failed+' 张识别失败':'',unread?unread+' 张未识别':'',pending?pending+' 项待确认':''].filter(Boolean).join(' · ')|| (ps.length?'本次检查已处理':'')}

function resetInspection(){photos=[];project={name:'',part:'',org:'',by:'',date:new Date().toLocaleDateString('sv-SE'),type:project.type||'',standards:project.standards||''};inspectionId=crypto.randomUUID();sel=0;open=0;view='check';kind='检查报告';persist();render();window.scrollTo(0,0)}
function inspectionBusy(){if(photos.some(p=>p.busy)){toast('照片仍在识别，请等待本次请求结束');return true}return false}
function startInspection(finish=false){if(inspectionBusy())return;if(!photos.length){resetInspection();return}const c=counts(),unfinished=photos.filter(p=>p.error||(!p.analyzed&&!p.findings.length)).length;modal(`<h2>${finish?'完成本次检查':'新建检查'}</h2><p>${photos.length} 张照片 · ${c.confirmed} 项已确认</p>${c.pending||unfinished?`<p class="sub">${c.pending} 项待确认，${unfinished} 张尚未完成识别，将作为草稿保存。</p>`:''}<div class="actions"><button data-action="close">返回</button><button class="primary" data-archive-confirm="${finish?'finish':'new'}">${finish?'归档并开始下一次':'保存当前并新建'}</button></div>`)}
let historySaving=false;
async function saveCurrentHistory(status){if(photos.length)await InspectionHistory.save(InspectionHistory.snapshot(inspectionId,photos,project,status))}
async function archiveCurrent(finish){if(historySaving||inspectionBusy())return;historySaving=true;try{const incomplete=photos.some(p=>p.error||(!p.analyzed&&!p.findings.length)||(p.findings||[]).some(f=>f.decision==='pending'));await saveCurrentHistory(finish&&!incomplete?'completed':'draft');$('#modal').close();resetInspection();toast('已保存到历史，可以开始新的检查')}catch(e){toast('历史保存失败，当前检查已保留。请先下载备份。')}finally{historySaving=false}}
async function showHistory(){if(inspectionBusy())return;modal('<h2>历史检查</h2><p>正在读取…</p>');try{const rows=await InspectionHistory.list();$('#modal').innerHTML=`<div class="history-head"><h2>历史检查</h2><button data-action="close">关闭</button></div><p class="sub">保存在此浏览器，换设备不会同步。</p>${rows.length?rows.map(r=>`<button class="history-item" data-history-open="${esc(r.id)}"><span><b>${esc(r.project.name||'未命名检查')}</b><span class="sub">${esc(r.project.date||'')} · ${r.photoCount} 张照片 · ${r.confirmedCount} 项已确认</span></span><span>${r.status==='completed'?'已归档':'草稿'} →</span></button>`).join(''):'<div class="empty">暂无历史检查</div>'}`}catch(e){$('#modal').innerHTML='<h2>暂时无法读取历史</h2><p>当前记录仍保留在检查页。</p><button data-action="close">关闭</button>'}}
async function reopenInspection(id){if(historySaving||inspectionBusy())return;historySaving=true;try{const record=await InspectionHistory.get(id);if(!record)throw Error('记录不存在');if(photos.length&&inspectionId!==id)await saveCurrentHistory('draft');photos=record.photos;photos.forEach(p=>{p.busy=false});project=record.project;inspectionId=record.id;sel=0;open=0;view='check';persist();$('#modal').close();render();window.scrollTo(0,0);toast('已打开历史检查')}catch(e){toast('打开失败，当前检查已保留')}finally{historySaving=false}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.archiveConfirm)archiveCurrent(b.dataset.archiveConfirm==='finish');if(b.dataset.historyOpen)reopenInspection(b.dataset.historyOpen);if(b.dataset.action==='new-inspection')startInspection();if(b.dataset.action==='finish-inspection')startInspection(true);if(b.dataset.action==='history')showHistory()});

// 刷新或手机切回页面时接着上次的检查继续，不再自动归档清空
restore().then(render);
function supportHtml(p){const notes=p.quality_notes||[],qs=(p.questions||[]).filter(q=>!q.affects?.length);if(!notes.length&&!qs.length)return '';return `<div class="support">${notes.length?`<details><summary>补拍建议（${notes.length}）</summary>${notes.map(n=>`<p>${esc(n)}</p>`).join('')}</details>`:''}${qs.length?`<details><summary>待现场核实（${qs.length}）</summary>${qs.map(q=>`<p>${esc(q.q)}</p>`).join('')}</details>`:''}</div>`}

</script></body></html>
